<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="description" content="Cogtopia – a cozy factory builder. Build belts, smelt ore, get rich, never finish.">
<title>Cogtopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<style>
/* ---------- Farben ---------- */
:root {
  --paper: #fdf6e8; --paper2: #f5e8cc; --paper3: #ead8b2; --line: #dec597;
  --ink: #3a2a1e; --ink2: #6c5440; --mute: #9a8268;
  --wood: #a0673f; --wood2: #7a4a2b; --wood3: #5a341c;
  --yel: #f2c230; --yel2: #d9a514; --yel3: #a87c08; --green: #5aa046; --green2: #3f7d30; --red: #d0503a; --red2: #9a3020; --teal: #2a9d8f; --blue: #3a78c8;
  --shadow: 0 8px 24px rgba(60, 38, 18, .26), 0 2px 6px rgba(60, 38, 18, .16);
  --r: 18px; --font: 'Nunito', system-ui, sans-serif; --title: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --sb: env(safe-area-inset-bottom, 0px); --st: env(safe-area-inset-top, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
  --bar-h: 112px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3ff; color: var(--ink); font: 700 15px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
button, input, select { font: inherit; color: inherit; }
kbd { display: inline-block; min-width: 1.4em; padding: 0 .32em; border-radius: 5px; background: var(--paper2); border: 1px solid var(--line);
  border-bottom-width: 2px; font: 800 .74em/1.45 var(--font); text-align: center; color: var(--ink2); vertical-align: middle; }
small { font-weight: 700; }
.mute { color: var(--mute); }

/* ---------- Ladebild ---------- */
#boot { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #fff6dc, #f2d78e 55%, #d9a64a);
  transition: opacity .7s; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot .t { font: 700 clamp(46px, 11vw, 96px)/1 var(--title); color: #fff; text-shadow: 0 4px 0 var(--wood2), 0 9px 20px rgba(60,38,18,.35); text-align: center; }
#boot .g { display: block; text-align: center; font-size: 64px; animation: spin 3s linear infinite; color: var(--wood2); line-height: 1; margin-bottom: 8px; }
#boot .s { margin-top: 18px; text-align: center; color: var(--wood2); font-weight: 800; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Ebenen ---------- */
#ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; user-select: none; -webkit-user-select: none; }
#ui > * { pointer-events: none; }
#ui .live > * , #ui .live { pointer-events: auto; }
#ui .hud, #ui .side, #ui .buildbar, #ui .toolbar, #ui .info, #ui .tut { transition: opacity .3s, transform .3s; }
#ui.mode-menu .hud, #ui.mode-menu .side, #ui.mode-menu .buildbar, #ui.mode-menu .toolbar, #ui.mode-menu .info, #ui.mode-menu .tut,
#ui.mode-boot .hud, #ui.mode-boot .side, #ui.mode-boot .buildbar, #ui.mode-boot .toolbar, #ui.mode-boot .info, #ui.mode-boot .tut { opacity: 0; pointer-events: none !important; visibility: hidden; }
#ui.mode-play .menu { display: none; }
.hud, .side, .buildbar { pointer-events: none !important; }
.hud > *, .side > *, .buildbar > * { pointer-events: auto; }

.panel { background: var(--paper); border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  background-image: radial-gradient(rgba(160,103,63,.05) 1px, transparent 1.5px); background-size: 7px 7px; }
.chip { background: rgba(253,246,232,.94); border: 2px solid var(--line); border-radius: 15px; box-shadow: 0 4px 12px rgba(60,38,18,.2);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* ---------- Knöpfe ---------- */
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 14px; padding: 9px 16px; font-weight: 800; color: var(--ink);
  background: linear-gradient(#fffaf0, #f2e2c2); box-shadow: inset 0 -3px 0 #d8bf92, 0 2px 6px rgba(60,38,18,.16);
  transition: transform .12s, filter .12s, box-shadow .12s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; white-space: nowrap; }
.btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 #d8bf92, 0 1px 3px rgba(60,38,18,.16); }
.btn:focus-visible, .bb:focus-visible, .rb:focus-visible, .fb:focus-visible { outline: 3px solid var(--yel); outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; transform: none; filter: grayscale(.4); }
.btn.main { color: #fff; background: linear-gradient(#74b85a, var(--green)); box-shadow: inset 0 -3px 0 var(--green2), 0 3px 8px rgba(40,70,20,.3); text-shadow: 0 1px 0 rgba(0,0,0,.2); }
.btn.wood { color: #fff7ea; background: linear-gradient(#b8794b, var(--wood)); box-shadow: inset 0 -3px 0 var(--wood3), 0 3px 8px rgba(60,38,18,.3); }
.btn.danger { color: #fff; background: linear-gradient(#e0705a, var(--red)); box-shadow: inset 0 -3px 0 var(--red2), 0 3px 8px rgba(120,40,20,.3); }
.btn.danger small { color: #ffe3d8; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink2); }
.btn.ghost:hover { background: rgba(160,103,63,.1); }
.btn.small { min-height: 34px; padding: 5px 11px; border-radius: 11px; font-size: 13.5px; }
.btn.icon { width: 48px; height: 48px; padding: 0; font-size: 22px; border-radius: 15px; position: relative; }
.btn.icon.small { width: 36px; height: 36px; min-height: 36px; font-size: 16px; }
.btn.wide { width: 100%; }
.btn.big { min-height: 58px; font-size: 19px; padding: 10px 24px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }
.lnk { border: 0; background: none; padding: 0; color: var(--wood); font-weight: 800; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: inherit; }
.coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; vertical-align: -.14em; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff3b0, #f2c230 45%, #c48a10); box-shadow: inset 0 -1.5px 0 rgba(120,70,0,.45), 0 0 0 1.5px #b07a08; }
.cn { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; white-space: nowrap; }
.cn.rp { color: #6a4aa8; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 9px; background: var(--paper2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 800; color: var(--ink2); white-space: nowrap; }
.tag.ok { background: #e2f2d6; border-color: #b7d9a2; color: var(--green2); }
.tag.gold { background: #fff0b8; border-color: #ecc95a; color: var(--yel3); }
.tag.fail { background: #f6e2dc; border-color: #e6bfb2; color: #8a3a2a; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bi, .ii { display: inline-block; width: 44px; height: 44px; object-fit: contain; vertical-align: middle; image-rendering: auto; }
.ii { width: 28px; height: 28px; filter: drop-shadow(0 1px 1px rgba(60,38,18,.25)); }
.bi.sm { width: 26px; height: 26px; } .ii.sm { width: 22px; height: 22px; } .ii.lg { width: 64px; height: 64px; }
.emo { display: inline-grid; place-items: center; font-size: 26px; line-height: 1; width: 44px; height: 44px; }
.emo.sm { width: 26px; height: 26px; font-size: 17px; }
.dot { display: inline-block; width: 18px; height: 18px; border-radius: 6px; vertical-align: middle; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.dot.sm { width: 15px; height: 15px; } .dot.lg { width: 48px; height: 48px; border-radius: 12px; }
.bar { position: relative; height: 14px; border-radius: 8px; background: var(--paper3); overflow: hidden; box-shadow: inset 0 1px 2px rgba(60,38,18,.2); }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: linear-gradient(90deg, #8fc96a, var(--green)); transition: width .3s; }
.bar span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 14px; font-weight: 900; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.6); }
.bar.thin { height: 8px; } .bar.big { height: 22px; } .bar.big span { line-height: 22px; font-size: 13px; }
.bar.gold i { background: linear-gradient(90deg, #f7d76a, var(--yel)); } .bar.green i { background: linear-gradient(90deg, #a5e27a, #4ab84a); }

/* ---------- HUD ---------- */
.hud { position: absolute; left: calc(12px + var(--sl)); top: calc(12px + var(--st)); right: 80px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.hud .chip { display: flex; align-items: center; gap: 9px; padding: 6px 14px 6px 10px; cursor: pointer; }
.hud .chip > span { display: flex; flex-direction: column; line-height: 1.05; }
.hud .money .coin { font-size: 30px; }
.hud .money b { font: 700 28px/1 var(--title); color: var(--wood2); display: inline-block; transform-origin: left center; min-width: 2ch; }
.hud .money b.pop { animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes pop { 40% { transform: scale(1.16); color: var(--yel3); } }
.hud small { font-size: 12px; color: var(--green2); font-weight: 800; }
.hud .rp .flask { font-size: 22px; font-style: normal; }
.hud .rp b { font: 700 20px/1 var(--title); color: #6a4aa8; }
.hud .rp small { color: var(--mute); }
.hud .boosts { display: flex; gap: 6px; flex-wrap: wrap; }
.chip.boost { padding: 6px 11px; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; cursor: default; }
.chip.boost.turbo { border-color: #8ac8ff; background: rgba(226,242,255,.95); }
.chip.boost.gold { border-color: #ecc95a; background: rgba(255,245,200,.95); }
.chip.boost.warn { border-color: #e6a090; background: rgba(255,232,224,.95); }
.hud .ttl { flex-basis: 100%; height: 0; margin-top: -4px; font: 600 13px var(--title); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); padding-left: 6px; }
.hud .ttl:empty { display: none; }

/* ---------- Seitenleiste ---------- */
.side { position: absolute; right: calc(12px + var(--sr)); top: calc(12px + var(--st)); display: flex; flex-direction: column; gap: 7px; z-index: 30; }
.side .sb { background: rgba(253,246,232,.94); border: 2px solid var(--line); box-shadow: 0 3px 10px rgba(60,38,18,.2); }
.side .sb.on { background: linear-gradient(#ffe48a, var(--yel)); border-color: var(--yel2); }
.side .sb.ready::after { content: ''; position: absolute; right: -3px; top: -3px; width: 13px; height: 13px; border-radius: 50%; background: var(--green); border: 2px solid #fff; animation: blink 1.2s infinite; }
.side .badge { position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font: 900 12px/20px var(--font); font-style: normal; display: none; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.side .badge.on { display: block; }
.side .sb.bump { animation: bump .5s ease; }
@keyframes bump { 30% { transform: scale(1.25) rotate(-8deg); } 60% { transform: scale(.95) rotate(4deg); } }
@keyframes blink { 50% { opacity: .35; } }

/* ---------- Bauleiste ---------- */
.buildbar { position: absolute; left: 50%; bottom: calc(10px + var(--sb)); transform: translateX(-50%); display: flex; gap: 6px; align-items: flex-end;
  max-width: calc(100% - 24px); padding: 7px 10px 8px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; border-radius: 20px;
  background: rgba(253,246,232,.95); border: 2px solid var(--line); box-shadow: var(--shadow); pointer-events: auto !important; overscroll-behavior-x: contain; }
.grp { display: flex; flex-direction: column; gap: 3px; flex: none; }
.grp + .grp { padding-left: 7px; border-left: 2px dashed var(--paper3); }
.gl { font-size: 10.5px; font-weight: 900; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; padding-left: 3px; white-space: nowrap; }
.gb { display: flex; gap: 5px; }
.bb { position: relative; width: 62px; flex: none; border: 2px solid transparent; border-radius: 14px; background: var(--paper2); cursor: pointer; padding: 3px 2px 3px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; transition: transform .15s, background .15s, border-color .15s; }
.bb:hover { transform: translateY(-3px); background: #fffaf0; }
.bb .im { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 11px; background: radial-gradient(#fffdf6, #efe0c0); }
.bb .c { font-size: 12px; line-height: 1.2; white-space: nowrap; max-width: 58px; overflow: hidden; text-overflow: ellipsis; }
.bb .c .cn { gap: 3px; }
.bb kbd { position: absolute; right: 2px; top: 2px; font-size: 9.5px; padding: 0 3px; min-width: 0; line-height: 1.35; }
.bb.tool kbd { font-size: 8.5px; }
.bb.tool .c { font-size: 10.5px; letter-spacing: -.02em; }
.bb.sel { border-color: var(--yel2); background: #fff4c4; box-shadow: 0 0 0 3px rgba(242,194,48,.35); transform: translateY(-3px); }
.bb.locked .im { filter: grayscale(1) opacity(.45); }
.bb.locked .c { color: var(--mute); }
.bb.poor .c { color: var(--red); }
.bb.poor .im { filter: saturate(.6) opacity(.8); }
.bb.dis { cursor: default; } .bb.dis .im, .bb.dis .c, .bb.dis kbd { opacity: .4; filter: grayscale(1); }
.pulse { animation: pulse 1.3s ease-in-out infinite; z-index: 2; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242,194,48,.0), 0 0 0 3px rgba(242,194,48,.9); } 50% { box-shadow: 0 0 0 9px rgba(242,194,48,.25), 0 0 0 3px rgba(242,194,48,1); } }
.side .sb.pulse { animation: pulse 1.3s ease-in-out infinite; }

/* ---------- Werkzeugzeile ---------- */
.toolbar { position: absolute; left: 50%; bottom: calc(var(--bar-h) + 18px + var(--sb)); transform: translateX(-50%) translateY(8px); display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 6px 8px; border-radius: 16px; background: rgba(253,246,232,.96); border: 2px solid var(--yel2); box-shadow: var(--shadow); opacity: 0; pointer-events: none !important; max-width: calc(100% - 24px); }
.toolbar.on { opacity: 1; transform: translateX(-50%); pointer-events: auto !important; }
.toolbar .im { width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.toolbar .im .bi { width: 40px; height: 40px; }
.toolbar .tx { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.toolbar .tx b { font: 600 16px var(--title); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.toolbar .tx small { color: var(--ink2); font-size: 12.5px; max-width: 420px; }

/* ---------- Hinweise ---------- */
.ctip { position: fixed; left: 0; top: 0; padding: 5px 10px; border-radius: 10px; background: rgba(32,44,30,.88); color: #e8ffe0; font-size: 13px; font-weight: 800; white-space: nowrap;
  opacity: 0; transition: opacity .12s; box-shadow: 0 3px 10px rgba(0,0,0,.25); z-index: 30; }
.ctip.on { opacity: 1; }
.ctip.bad { background: rgba(120,30,20,.9); color: #fff0ea; }
.btip { position: fixed; left: 0; top: 0; width: max-content; max-width: 260px; padding: 9px 12px; border-radius: 13px; background: var(--paper); border: 2px solid var(--line); box-shadow: var(--shadow);
  opacity: 0; transition: opacity .12s; z-index: 35; font-size: 13px; }
.btip.on { opacity: 1; }
.btip b { font: 600 15.5px var(--title); display: block; color: var(--wood2); }
.btip p { margin: 3px 0 6px; color: var(--ink2); line-height: 1.35; }
.btip .ln { display: flex; justify-content: space-between; gap: 14px; }
.btip .lock { margin-top: 6px; color: var(--red); }

/* ---------- Info-Panel ---------- */
.info { position: absolute; right: calc(76px + var(--sr)); top: calc(70px + var(--st)); width: 336px; max-height: calc(100% - var(--bar-h) - 110px); overflow: auto; padding: 12px 14px 12px;
  opacity: 0; transform: translateX(20px); pointer-events: none !important; }
.info.on { opacity: 1; transform: none; pointer-events: auto !important; }
.info { background: var(--paper); border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.info .ih { display: flex; align-items: center; gap: 10px; }
.info .ih .im { width: 52px; height: 52px; flex: none; display: grid; place-items: center; border-radius: 13px; background: radial-gradient(#fffdf6, #efe0c0); border: 2px solid var(--line); }
.info .ih .im .bi { width: 46px; height: 46px; }
.info .it { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.info .it b { font: 600 19px/1.15 var(--title); color: var(--wood2); }
.stars i { font-style: normal; color: #d8cbb0; font-size: 16px; letter-spacing: 1px; } .stars i.on { color: #f2b818; text-shadow: 0 1px 0 #b07a08; }
.state { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0 2px; padding: 2px 10px; border-radius: 10px; background: var(--paper2); font-size: 13px; }
.state i { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); }
.state.ok i { background: #3ec85a; box-shadow: 0 0 6px #3ec85a; } .state.warn i { background: #f2b818; } .state.bad i { background: var(--red); }
.xp { margin-top: 6px; } .xp small { color: var(--mute); font-size: 11.5px; }
.ib { margin-top: 8px; }
.kv { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 3px 0; font-size: 14px; }
.kv span { color: var(--ink2); } .kv b { display: inline-flex; align-items: center; gap: 5px; }
.kv .takt { font: 700 20px var(--title); color: var(--green2); }
.lbl { margin: 8px 0 4px; font-size: 12px; font-weight: 900; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; }
.rbs { display: flex; flex-direction: column; gap: 5px; }
.rb { display: flex; align-items: center; gap: 4px; border: 2px solid var(--line); border-radius: 12px; background: #fffaf0; padding: 4px 10px; cursor: pointer; font-weight: 800; min-height: 36px; text-align: left; }
.rb:hover { background: #fff4d6; }
.rb.on { border-color: var(--green); background: #e8f6dc; }
.rb small { color: var(--ink2); }
.rb .rnm { margin-left: 6px; font-size: 13px; color: var(--ink2); }
.op { font-style: normal; color: var(--mute); font-weight: 900; margin: 0 2px; }
.bufs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.buf { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 10px; background: var(--paper2); font-size: 13px; }
.buf.ok { background: #e2f2d6; } .buf.emp { color: var(--mute); min-width: 34px; justify-content: center; }
.filt { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 5px; max-height: 200px; overflow: auto; }
.fb { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 2px; border: 2px solid var(--line); border-radius: 11px; background: #fffaf0; cursor: pointer; font-size: 18px; }
.fb small { font-size: 10px; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fb.on { border-color: var(--green); background: #e8f6dc; }
.ia { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.warn { color: var(--red); font-weight: 800; margin: 6px 0; }
.note { color: var(--ink2); font-size: 13.5px; margin: 0 0 10px; }

/* ---------- Anleitung ---------- */
.tut { position: absolute; left: calc(12px + var(--sl)); top: calc(84px + var(--st)); width: 340px; display: flex; gap: 8px; align-items: flex-start; opacity: 0; pointer-events: none !important; }
.tut.on { opacity: 1; pointer-events: auto !important; }
.tut .pip { flex: none; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 27px; background: linear-gradient(#fff, #fff1cc);
  border: 3px solid #fff; box-shadow: var(--shadow); animation: bob 2.6s ease-in-out infinite; }
.tut .bub { position: relative; flex: 1; padding: 10px 13px 10px; }
.tut .bub::before { content: ''; position: absolute; left: -10px; top: 16px; width: 15px; height: 15px; background: var(--paper); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.tut .st { font-size: 11.5px; font-weight: 900; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; gap: 8px; }
.tut .st .lnk { text-transform: none; letter-spacing: 0; font-size: 12px; }
.tut p { margin: 4px 0 7px; font-size: 14.5px; line-height: 1.4; }
.tut .dots { display: flex; gap: 4px; } .tut .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--paper3); } .tut .dots i.on { background: var(--green); } .tut .dots i.cur { background: var(--yel); box-shadow: 0 0 0 2px rgba(242,194,48,.35); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

/* ---------- Sprechblasen, Pfeil ---------- */
.anchors { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
.hud, .buildbar, .toolbar, .info, .tut { z-index: 3; }
.anchors > * { position: absolute; left: 0; top: 0; will-change: transform; }
.bubble .in { transform: translate(-50%, calc(-100% - 10px)); max-width: 230px; width: max-content; padding: 7px 12px 8px; border-radius: 14px; background: #fff; border: 2px solid var(--line);
  box-shadow: 0 4px 12px rgba(60,38,18,.25); font-size: 13.5px; line-height: 1.3; animation: bubin .35s cubic-bezier(.2,1.5,.4,1) both; position: relative; }
.bubble .in::after { content: ''; position: absolute; left: calc(50% - 7px); bottom: -9px; width: 12px; height: 12px; background: #fff; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.bubble .in b { display: block; font: 600 12px var(--title); color: var(--wood); text-transform: uppercase; letter-spacing: .04em; }
.bubble.steve .in b { color: #6a4aa8; }
@keyframes bubin { from { opacity: 0; transform: translate(-50%, calc(-100% + 4px)) scale(.7); } }
.pointer .in { transform: translate(-50%, -100%); font-size: 42px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); animation: bob .9s ease-in-out infinite; }

/* ---------- Toasts ---------- */
.toasts { position: absolute; left: 50%; top: calc(14px + var(--st)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 7px; align-items: center; z-index: 40; width: min(520px, calc(100% - 200px)); }
.toast { padding: 8px 16px; font-weight: 800; font-size: 14px; max-width: 100%; text-align: center; animation: toast 4s ease both; border-radius: 14px; }
.toast.err { border-color: #e2a294; color: #8a2d1d; background: #fff1ec; }
.toast.gold { border-color: #ecc95a; background: #fff8dc; }
.toast.ok { border-color: #b7d9a2; }
.toast.mute { color: var(--ink2); }
.toast.ach { border: 3px solid var(--yel2); background: linear-gradient(#fff9de, #ffefb0); font-size: 15px; animation-duration: 5.2s; }
.toast.ach b { display: block; font: 600 12px var(--title); color: var(--yel3); text-transform: uppercase; letter-spacing: .08em; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-14px) scale(.9); } 7% { opacity: 1; transform: none; } 88% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }

/* ---------- Panels (Blätter) ---------- */
.sheet { position: absolute; inset: 0; display: none; place-items: center; padding: calc(16px + var(--st)) 76px calc(16px + var(--sb)) 16px; background: rgba(40,26,14,.22); z-index: 25; }
.sheet.on { display: grid; animation: fadein .2s ease both; }

.sheet .card { width: min(860px, 100%); max-height: min(760px, calc(100vh - 40px)); display: flex; flex-direction: column; animation: sheetin .3s cubic-bezier(.2,1.2,.4,1) both; overflow: hidden; }

.grid { display: grid; gap: 10px; }

.cts { display: flex; flex-direction: column; gap: 10px; }

.kr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.kb { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; min-width: 150px; font-size: 13.5px; }
.spark { padding: 10px 12px; border-radius: 15px; background: #fffaf0; border: 2px solid var(--line); }
.spark .sl { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); margin-bottom: 4px; } .spark .sl b { color: var(--green2); font: 600 16px var(--title); }

.kvs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 18px; margin-top: 10px; }
.kvs .kv { border-bottom: 1px dashed var(--paper3); }
table.prod { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.prod th { text-align: right; font-size: 11.5px; color: var(--mute); text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; }

.ag { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.ac { display: flex; gap: 10px; padding: 9px 11px; border-radius: 14px; background: var(--paper2); border: 2px solid var(--line); opacity: .82; }
.ac.have { background: linear-gradient(#fffbe6, #fff2c0); border-color: #ecc95a; opacity: 1; }
.ac .tr { font-size: 28px; filter: grayscale(1); } .ac.have .tr { filter: none; }
.ac > div { flex: 1; min-width: 0; } .ac b { font: 600 15px var(--title); } .ac p { margin: 0 0 4px; font-size: 12.5px; color: var(--ink2); }
.ac small { font-size: 11px; color: var(--mute); } .ac .rw { margin-top: 3px; font-size: 12px; color: var(--ink2); display: flex; gap: 4px; align-items: center; }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 5px; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 0 0 1px rgba(0,0,0,.2); vertical-align: middle; }

.minimap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; width: min(440px, 100%); margin: 0 auto 6px; }
.pc { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; border: 2px solid var(--line); font-size: 18px; background: var(--paper2); }
.pc.open { background: linear-gradient(#a6d47e, #7cb34e); border-color: #5f9a3e; color: #fff; cursor: pointer; font-weight: 900; }
.pc.buy { background: #fff7d8; border-color: #ecc95a; border-style: dashed; cursor: pointer; display: flex; flex-direction: column; gap: 0; padding: 2px; }
.pc.buy small { font-size: 10px; line-height: 1.1; } .pc.buy .coin { font-size: 18px; } .pc.buy.can { background: #fff0a8; border-style: solid; animation: glow 1.6s infinite; }
.pc.lock { opacity: .5; font-size: 14px; }
.crates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cr { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px; border-radius: 15px; border: 2px solid #ecc95a; background: linear-gradient(#fffbe6, #fff0c0); cursor: pointer; }
.cr .box { font-size: 44px; animation: wob 2.4s ease-in-out infinite; } .cr:nth-child(2n) .box { animation-delay: -.7s; }
.cr b { font-size: 13px; color: var(--ink2); }
@keyframes wob { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-9deg); } 90% { transform: rotate(8deg); } 95% { transform: rotate(-4deg); } }

.worlds { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-bottom: 10px; }
.wd { text-align: left; border: 3px solid transparent; border-radius: 14px; padding: 9px 11px; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 2px; min-height: 84px; }
.wd small { font-size: 11.5px; color: var(--ink2); line-height: 1.3; } .wd b { font: 600 16px var(--title); }

.w-wiese { background: linear-gradient(#d8f0c4, #a8d482); } .w-wueste { background: linear-gradient(#fff0cc, #ecc888); } .w-eis { background: linear-gradient(#f4faff, #cfe4f6); }
.w-mond { background: linear-gradient(#5a5e72, #2c2e3c); } .w-mond b, .w-mond small { color: #eef; }
.set { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; border-bottom: 1px dashed var(--paper3); }

.swb i { width: 40px; height: 22px; border-radius: 7px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.swb small { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 64px; }

/* ---------- Startmenü ---------- */
.menu { position: absolute; inset: 0; z-index: 20; background: linear-gradient(90deg, rgba(253,246,232,.92) 0%, rgba(253,246,232,.7) 30%, rgba(253,246,232,0) 58%); }
.menu .mwrap { position: absolute; left: max(6vw, calc(24px + var(--sl))); top: 50%; transform: translateY(-50%); width: min(400px, calc(100% - 48px)); animation: menuin .7s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes menuin { from { opacity: 0; transform: translateY(-46%); } }
.logo { display: flex; align-items: center; gap: 10px; }
.logo .cog { font-size: 70px; line-height: 1; color: var(--yel2); text-shadow: 0 3px 0 var(--yel3); animation: spin 14s linear infinite; display: inline-block; }
.logo h1 { margin: 0; font: 700 clamp(52px, 8vw, 84px)/1 var(--title); color: var(--wood2); letter-spacing: -.01em; text-shadow: 0 4px 0 #f2d78e, 0 10px 24px rgba(60,38,18,.25); }
.menu .tag { margin: 8px 0 24px 4px; font: 600 18px/1.35 var(--title); color: var(--ink2); background: none; border: 0; padding: 0; white-space: normal; }
.mbtns { display: flex; flex-direction: column; gap: 10px; }
.mbtns .btn { justify-content: flex-start; min-height: 52px; font-size: 17px; padding: 8px 20px; }
.mbtns .btn.big { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; min-height: 62px; }
.mbtns .btn.big small { font-size: 12.5px; opacity: .9; font-weight: 700; }
.langbtn { position: absolute; right: calc(16px + var(--sr)); top: calc(16px + var(--st)); gap: 8px; }
.langbtn .flag { font-size: 22px; } .langbtn small { color: var(--mute); }
.mfoot { position: absolute; left: 50%; bottom: calc(14px + var(--sb)); transform: translateX(-50%); font-size: 12.5px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); text-align: center; width: max-content; max-width: calc(100% - 32px); }

/* ---------- Dialoge, Karten ---------- */
.modals { position: absolute; inset: 0; z-index: 50; pointer-events: none !important; }
.modals > * { pointer-events: auto; }
.mback { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(40,26,14,.35); animation: fadein .18s ease both; }
.modal { width: min(460px, 100%); padding: 18px 20px 16px; animation: sheetin .28s cubic-bezier(.2,1.3,.4,1) both; max-height: calc(100vh - 32px); overflow: auto; }
.modal h2 { margin: 0 0 8px; font: 600 23px var(--title); color: var(--wood2); }
.modal p { margin: 0 0 10px; color: var(--ink2); }
.modal .mbt { margin-top: 14px; }
.off { text-align: center; } .off .big { font-size: 56px; display: block; animation: bob 2s infinite; } .off .amt { display: block; font: 700 38px var(--title); color: var(--green2); margin-top: 4px; }
.overlay { position: absolute; inset: 0; z-index: 45; display: none; place-items: center; padding: 16px; background: rgba(40,26,14,.28); }
.overlay.on { display: grid; animation: fadein .2s ease both; }
.rcard { position: relative; width: min(400px, 100%); padding: 20px 22px 18px; text-align: center; overflow: hidden; cursor: pointer; animation: cardin .6s cubic-bezier(.2,1.6,.4,1) both; border: 3px solid var(--yel2); }
.rcard .rays { position: absolute; left: 50%; top: 42%; width: 560px; height: 560px; margin: -280px; background: repeating-conic-gradient(rgba(242,194,48,.18) 0 10deg, transparent 10deg 20deg); animation: spin 14s linear infinite; z-index: -1; }
.rcard .kick { font: 600 14px var(--title); color: var(--yel3); text-transform: uppercase; letter-spacing: .12em; }
.rcard h2 { margin: 2px 0 12px; font: 700 30px var(--title); color: var(--wood2); }
.rcard .rr { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }
.rcard .rr .op { font-size: 26px; }
.rcard p { margin: 0 0 6px; }
@keyframes cardin { from { opacity: 0; transform: scale(.4) rotate(-8deg); } }
.crate-open { display: grid; place-items: center; cursor: pointer; }
.cbox { position: relative; font-size: 120px; line-height: 1; animation: shake 1.1s ease-in both; filter: drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
.cbox .body { display: block; animation: boxgo 1.4s ease-in forwards; }
@keyframes shake { 0% { transform: scale(.3); } 15% { transform: scale(1.05); } 25%, 45%, 65%, 85% { transform: rotate(-9deg) scale(1); } 35%, 55%, 75%, 95% { transform: rotate(9deg) scale(1.03); } 100% { transform: scale(1.25); } }
@keyframes boxgo { 0%, 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.6); } }
.reveal { grid-area: 1 / 1; width: min(360px, calc(100vw - 32px)); padding: 18px 20px; text-align: center; animation: cardin .55s cubic-bezier(.2,1.6,.4,1) 1.15s both; border: 3px solid var(--yel2); }
.crate-open .cbox { grid-area: 1 / 1; }
.reveal .ico { font-size: 58px; display: block; } .reveal h2 { margin: 2px 0 6px; font: 700 26px var(--title); color: var(--wood2); } .reveal p { margin: 0 0 12px; color: var(--ink2); }

  .side { gap: 5px; right: calc(8px + var(--sr)); top: calc(8px + var(--st)); }
  .btn.icon { width: 44px; height: 44px; font-size: 19px; border-radius: 13px; }
  .side .sb { width: 44px; height: 44px; }

  .sheet { padding: 0; place-items: end stretch; }

  @keyframes sheetup { from { transform: translateY(40%); opacity: 0; } }
