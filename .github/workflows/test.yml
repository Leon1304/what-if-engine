# Smoke test: every engine change builds the example story and the scenes in tests/ and renders a few frames.
# Fails on page errors (syntax, missing functions, broken scenes). Contact sheets are attached as an artifact.
name: test

on:
  push:
    branches: [main]
    paths: ['template.html', 'assemble.py', 'render.mjs', 'sfx/**', 'tests/**', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      update_golden:
        description: 'Write the current shots as the new reference frames (tests/golden) and commit them'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PW_VERSION: 1.65.0

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ env.PW_VERSION }}
      - name: deps
        run: |
          npm init -y >/dev/null && npm i --no-audit --no-fund three@0.170.0 @dimforge/rapier3d-deterministic-compat@0.21.0 playwright@$PW_VERSION >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m pip install -q numpy
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null; }
      - name: smoke test
        run: SMOKE_DIR="$RUNNER_TEMP/smoke" bash tests/run.sh
      - name: reference frames (v3.0)
        if: always()
        run: |
          if [ "${{ inputs.update_golden }}" = "true" ]; then
            python3 tests/golden.py "$RUNNER_TEMP/smoke" --update
            git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add tests/golden && git commit -m "tests: update reference frames" && git push || echo "nothing to commit"
          else
            python3 tests/golden.py "$RUNNER_TEMP/smoke" | tee "$RUNNER_TEMP/golden.txt"
            { echo "### Reference frames"; grep -E '^(CHANGED|NEW|golden):' "$RUNNER_TEMP/golden.txt" | head -60 | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-sheets
          path: ${{ runner.temp }}/smoke/shots_*/sheet.jpg
          retention-days: 7
