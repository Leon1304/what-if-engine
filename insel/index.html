<style id="ui-css">
/* ---------- Grundfarben ---------- */
:root {
  --paper: #fbf4e6; --paper2: #f3e6cc; --paper3: #ead6b1; --line: #dcc49a;
  --ink: #3d2b1f; --ink2: #6e5641; --mute: #9a8268;
  --wood: #a0673f; --wood2: #7a4a2b; --wood3: #5a341c;
  --green: #5f9a45; --green2: #477a31; --gold: #e9b44c; --gold2: #c98f22; --red: #c4553f; --sky: #6fa9d4; --water: #4b95c9;
  --shadow: 0 8px 24px rgba(60, 38, 18, .28), 0 2px 6px rgba(60, 38, 18, .18);
  --r: 18px; --font: 'Nunito', system-ui, sans-serif; --title: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc8e8; color: var(--ink); font: 600 15px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button, input, select { font: inherit; color: inherit; }
kbd { display: inline-block; min-width: 1.5em; padding: 0 .35em; border-radius: 6px; background: var(--paper2); border: 1px solid var(--line);
  border-bottom-width: 2px; font: 700 .78em/1.5 var(--font); text-align: center; color: var(--ink2); }

/* ---------- Ladebild ---------- */
#boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: linear-gradient(#8fc1e6, #cfe6f3 70%, #f7ecd8);
  transition: opacity .8s; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot .t { font: 700 clamp(44px, 10vw, 92px)/1 var(--title); color: #fff; text-shadow: 0 4px 0 var(--wood2), 0 8px 18px rgba(60,38,18,.35); text-align: center; }
#boot .s { margin-top: 18px; text-align: center; color: var(--ink2); font-weight: 800; }
#boot .dots i { display: inline-block; width: 9px; height: 9px; margin: 0 4px; border-radius: 50%; background: var(--wood); animation: bob 1s infinite ease-in-out; }
#boot .dots i:nth-child(2) { animation-delay: .15s } #boot .dots i:nth-child(3) { animation-delay: .3s }

/* ---------- Ebenen ---------- */
#ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; user-select: none; -webkit-user-select: none; }
#ui > * { pointer-events: none; }
#ui .live, #ui .live * { pointer-events: auto; }
#ui.photo .hud, #ui.photo .stackbar, #ui.photo .fx, #ui.photo .tut, #ui.photo .cards, #ui.photo .banner, #ui.photo .info { display: none !important; }
#ui.menu .hud, #ui.menu .stackbar, #ui.menu .fx, #ui.menu .tut, #ui.menu .cards, #ui.menu .info { display: none !important; }
#ui.hidecls .hud, #ui.hidecls .stackbar { opacity: 0; }

.panel { background: var(--paper); border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  background-image: radial-gradient(rgba(160,103,63,.05) 1px, transparent 1.5px); background-size: 7px 7px; }
.chip { background: rgba(251,244,230,.93); border: 2px solid var(--line); border-radius: 14px; box-shadow: 0 4px 12px rgba(60,38,18,.22);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

/* ---------- Knöpfe ---------- */
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 14px; padding: 10px 18px; font-weight: 800; color: var(--ink);
  background: linear-gradient(#fffaf0, #f2e2c2); box-shadow: inset 0 -3px 0 #d8bf92, 0 2px 6px rgba(60,38,18,.18);
  transition: transform .12s, filter .12s, box-shadow .12s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; }
.btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 #d8bf92, 0 1px 3px rgba(60,38,18,.18); }
.btn:focus-visible, .tc:focus-visible, .mode:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn[disabled] { opacity: .45; cursor: default; transform: none; filter: grayscale(.5); }
.btn.main { color: #fff; background: linear-gradient(#78b65a, var(--green)); box-shadow: inset 0 -3px 0 var(--green2), 0 3px 8px rgba(40,70,20,.3); text-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn.wood { color: #fff7ea; background: linear-gradient(#b8794b, var(--wood)); box-shadow: inset 0 -3px 0 var(--wood3), 0 3px 8px rgba(60,38,18,.3); }
.btn.danger { color: #fff; background: linear-gradient(#d86c55, var(--red)); box-shadow: inset 0 -3px 0 #96382a, 0 3px 8px rgba(120,40,20,.3); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink2); }
.btn.ghost:hover { background: rgba(160,103,63,.1); }
.btn.small { min-height: 34px; padding: 6px 12px; border-radius: 11px; font-size: 13px; }
.btn.icon { width: 46px; height: 46px; padding: 0; font-size: 21px; border-radius: 14px; position: relative; }
.btn.icon kbd { position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); font-size: 9.5px; min-width: 0; padding: 0 4px; white-space: nowrap; line-height: 1.45; }
.btn.wide { width: 100%; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; } .row.center { justify-content: center; }
.grow { flex: 1; }

/* ---------- HUD oben ---------- */
.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(12px + var(--safe-t)) 14px 0; display: flex; gap: 10px; align-items: flex-start; }
.score { padding: 8px 16px 10px; min-width: 210px; }
.score .lbl { font-size: 12px; color: var(--mute); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; }
.score .num { font: 700 34px/1.05 var(--title); color: var(--wood2); display: inline-block; transform-origin: left center; transition: transform .25s cubic-bezier(.3,1.8,.5,1); }
.score .num.pop { transform: scale(1.18); }
.score .gain { margin-left: 8px; font: 700 18px var(--title); color: var(--green); opacity: 0; transition: opacity .3s; }
.score .gain.on { opacity: 1; }
.bar { position: relative; height: 12px; margin-top: 6px; border-radius: 8px; background: var(--paper3); overflow: hidden; box-shadow: inset 0 1px 2px rgba(60,38,18,.2); }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: linear-gradient(90deg, var(--gold), #f3cd6f); box-shadow: inset 0 -2px 0 rgba(160,100,10,.25); }
.score .next { margin-top: 4px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.score .lbl span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clock { padding: 7px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.hud .spacer { flex: 1; }
.hud .btns { display: flex; gap: 8px; }

/* ---------- Stapel unten ---------- */
.stackbar { position: absolute; left: 50%; bottom: calc(14px + var(--safe-b)); transform: translateX(-50%); display: flex; align-items: flex-end; gap: 10px; }
.stack { padding: 10px 12px 8px; display: flex; align-items: flex-end; gap: 10px; }
.tc { position: relative; width: 82px; cursor: pointer; border-radius: 14px; padding: 6px 6px 5px; background: var(--paper2); border: 2px solid var(--line);
  text-align: center; transition: transform .18s, width .18s, background .18s; }
.tc:hover { transform: translateY(-3px); }
.tc .im { width: 100%; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; overflow: hidden; background: radial-gradient(#fff8e8, #ecdcbc); }
.tc .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tc .im .em { font-size: 34px; }
.tc .nm { margin-top: 4px; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc .ic { position: absolute; left: -6px; top: -8px; width: 28px; height: 28px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line); display: grid; place-items: center; font-size: 15px; }
.tc .qf { position: absolute; right: -8px; top: -9px; padding: 1px 7px 1px 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.tc.sel { width: 124px; background: #fffaf0; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(233,180,76,.35); }
.tc.sel .nm { font-size: 14px; }
.tc.sel .im .em { font-size: 54px; }
.stack .meta { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 4px; min-width: 64px; }
.stack .cnt { font: 700 22px/1 var(--title); color: var(--wood2); }
.stack .cnt small { display: block; font: 800 11px var(--font); color: var(--mute); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.rot { display: flex; gap: 6px; }
.palette { padding: 8px; max-width: min(92vw, 860px); display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
.palette .tc { width: 70px; flex: none; }
.palette .tc .im .em { font-size: 28px; }
.palette .tc.sel { width: 84px; }
.hint { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: var(--ink2); padding: 3px 10px; }

/* ---------- Schwebende Rückmeldungen ---------- */
.fx { position: absolute; inset: 0; overflow: hidden; }
.fx > * { position: absolute; left: 0; top: 0; will-change: transform; }
.pop .in { transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; white-space: nowrap; border-radius: 12px;
  background: rgba(251,244,230,.95); border: 2px solid #b9d9a6; box-shadow: 0 3px 8px rgba(40,60,20,.25); animation: popup 2.3s ease-out both; }
.pop .in b { font: 700 18px var(--title); color: var(--green2); }
.pop .in span { font-size: 12.5px; font-weight: 800; color: var(--ink2); }
.pop.gold .in { border-color: var(--gold); } .pop.gold .in b { color: var(--gold2); }
.pop.quest .in { border-color: #e7a197; } .pop.quest .in b { color: var(--red); }
.pop.big .in { padding: 6px 16px; border-width: 3px; } .pop.big .in b { font-size: 30px; }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 12% { opacity: 1; transform: translate(-50%, -60%) scale(1.08); }
  22% { transform: translate(-50%, -65%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%) scale(.95); } }
.perfect .in { transform: translate(-50%, -50%); font: 700 46px/1 var(--title); color: #fff; white-space: nowrap; letter-spacing: .02em;
  text-shadow: 0 3px 0 var(--gold2), 0 6px 0 var(--wood2), 0 10px 20px rgba(60,38,18,.4); animation: perfect 2.2s cubic-bezier(.2,1.4,.4,1) both; }
.perfect .in small { display: block; text-align: center; font-size: 20px; margin-top: 6px; text-shadow: 0 2px 0 var(--gold2), 0 4px 10px rgba(60,38,18,.4); }
@keyframes perfect { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -90%) scale(1.1) rotate(2deg); }
  30% { transform: translate(-50%, -95%) scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1); } }
.spark { width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: radial-gradient(#fff, #ffe08a 45%, rgba(255,200,80,0) 70%); animation: spark 1.2s ease-out both; }
@keyframes spark { 0% { opacity: 1; transform: translate(var(--x0), var(--y0)) scale(.5); } 100% { opacity: 0; transform: translate(var(--x1), var(--y1)) scale(1.4); } }
.flag .in { transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; animation: sway 3s ease-in-out infinite; transform-origin: 50% 100%; }
.flag .in span { padding: 2px 8px; border-radius: 10px; background: var(--red); color: #fff; font-weight: 800; font-size: 13px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.28); }
.flag .in i { width: 2px; height: 16px; background: var(--wood3); }
@keyframes sway { 0%, 100% { rotate: -3deg; } 50% { rotate: 3deg; } }
.edge { transform: translate(-50%, -50%); padding: 1px 7px; border-radius: 9px; font: 700 14px var(--title); background: rgba(251,244,230,.92); color: var(--green2); border: 2px solid #b9d9a6; }
.edge.bad { color: #fff; background: var(--red); border-color: #96382a; }
.hover { transform: translate(-50%, calc(-100% - 18px)); padding: 8px 12px; min-width: 150px; max-width: 260px; }
.hover .big { font: 700 26px/1 var(--title); color: var(--green2); }
.hover .big.zero { color: var(--mute); }
.hover .ln { font-size: 13px; display: flex; justify-content: space-between; gap: 12px; color: var(--ink2); }
.hover .ln b { color: var(--green2); }
.hover .why { color: var(--red); font-weight: 800; font-size: 13.5px; }
.hover .q { margin-top: 4px; font-size: 12.5px; color: var(--red); font-weight: 800; }
.pointer { font-size: 34px; transform: translate(-50%, -100%); filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
.pointer .in { animation: bob .9s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

/* ---------- Banner, Karten, Hinweise ---------- */
.banner { position: absolute; left: 50%; top: calc(86px + var(--safe-t)); transform: translateX(-50%); }
.ribbon { position: relative; padding: 10px 34px 12px; text-align: center; color: #fff8ea; border-radius: 14px;
  background: linear-gradient(#bd8152, var(--wood)); box-shadow: inset 0 -4px 0 var(--wood3), var(--shadow); animation: ribbon 3.4s ease both; }
.ribbon::before, .ribbon::after { content: ''; position: absolute; top: 12px; width: 26px; height: 100%; background: var(--wood2); z-index: -1; border-radius: 4px; }
.ribbon::before { left: -16px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 35% 50%); }
.ribbon::after { right: -16px; clip-path: polygon(0 0, 100% 0, 65% 50%, 100% 100%, 0 100%); }
.ribbon b { display: block; font: 700 26px/1.1 var(--title); text-shadow: 0 2px 0 var(--wood3); white-space: nowrap; }
.ribbon span { font-weight: 800; font-size: 14px; color: #ffe7b8; }
@keyframes ribbon { 0% { opacity: 0; transform: translateY(-30px) scale(.8); } 10% { opacity: 1; transform: translateY(0) scale(1.05); } 16% { transform: scale(1); }
  88% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-12px); } }
.cards { position: absolute; right: 14px; top: calc(80px + var(--safe-t)); display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
.ucard { width: 300px; padding: 14px; animation: slidein .5s cubic-bezier(.2,1.3,.4,1) both; }
.ucard.out { animation: slideout .35s ease-in both; }
.ucard h3 { margin: 0 0 8px; font: 700 20px var(--title); color: var(--wood2); display: flex; align-items: center; gap: 8px; }
.ucard .it { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.ucard .it .im { width: 64px; height: 64px; flex: none; border-radius: 12px; overflow: hidden; display: grid; place-items: center; font-size: 34px; background: radial-gradient(#fff8e8, #ecdcbc); border: 2px solid var(--line); }
.ucard .it .im img { width: 100%; height: 100%; object-fit: cover; }
.ucard .it b { font: 700 17px var(--title); } .ucard .it p { margin: 2px 0 0; font-size: 13px; color: var(--ink2); line-height: 1.3; }
.ucard .note { font-size: 12.5px; color: var(--mute); margin: 2px 0 8px; }
@keyframes slidein { from { opacity: 0; transform: translateX(60px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes slideout { to { opacity: 0; transform: translateX(60px); } }
.info { position: absolute; left: 14px; bottom: calc(150px + var(--safe-b)); width: 300px; padding: 12px 14px; animation: slidein .4s ease both; }
.info h3 { margin: 0 34px 4px 0; font: 700 19px var(--title); color: var(--wood2); }
.info p { margin: 0; font-size: 14px; color: var(--ink2); }
.info .x { position: absolute; right: 8px; top: 8px; }
.notes { position: static; }
.toasts { position: absolute; left: 50%; top: calc(166px + var(--safe-t)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 40; }
.toast { padding: 9px 16px; font-weight: 800; font-size: 14px; max-width: 86vw; text-align: center; animation: toast 4s ease both; }
.toast.err { border-color: #e2a294; color: #8a2d1d; }
@keyframes toast { 0% { opacity: 0; transform: translateY(14px); } 8% { opacity: 1; transform: none; } 88% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- Anleitung ---------- */
.tut { position: absolute; left: 14px; top: calc(128px + var(--safe-t)); width: 330px; display: flex; gap: 10px; align-items: flex-start; }
.tut.at-stack { left: 50%; top: auto; bottom: calc(196px + var(--safe-b)); transform: translateX(-50%); }
.tut .pip { flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: linear-gradient(#fff, #e8f3fb);
  border: 3px solid #fff; box-shadow: var(--shadow); animation: bob 2.6s ease-in-out infinite; }
.tut .bub { position: relative; flex: 1; padding: 11px 14px 10px; animation: slidein .45s ease both; }
.tut .bub::before { content: ''; position: absolute; left: -11px; top: 18px; width: 16px; height: 16px; background: var(--paper); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.tut .st { font-size: 11.5px; font-weight: 800; color: var(--mute); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }
.tut h4 { margin: 2px 0 4px; font: 700 18px var(--title); color: var(--wood2); }
.tut p { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
.tut .chk { font-size: 13px; color: var(--ink2); margin: -2px 0 8px; display: flex; gap: 12px; }
.tut .chk .ok { color: var(--green2); }
.tut .dots { display: flex; gap: 4px; margin-top: 2px; } .tut .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--paper3); } .tut .dots i.on { background: var(--gold); }

/* ---------- Bildschirme (Menü, Dialoge) ---------- */
.screens { position: absolute; inset: 0; z-index: 20; }
.screens > .scr { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: auto; animation: fadein .25s ease both; }
.screens > .scr.dim { background: rgba(40, 30, 20, .32); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.screens > .scr.out { animation: fadeout .2s ease both; }
@keyframes fadein { from { opacity: 0; } } @keyframes fadeout { to { opacity: 0; } }
.modal { position: relative; width: min(560px, 100%); max-height: calc(100% - 8px); overflow: auto; padding: 22px 24px; animation: pop .35s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(16px); } }
.modal h2 { margin: 0 40px 14px 0; font: 700 28px/1.1 var(--title); color: var(--wood2); }
.modal .x { position: absolute; right: 12px; top: 12px; }
.modal p { margin: 0 0 12px; }
.modal .sec { font: 800 12px var(--font); color: var(--mute); letter-spacing: .06em; text-transform: uppercase; margin: 16px 0 6px; }

.title-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; width: min(420px, 100%); }
.title { text-align: center; animation: bob 5s ease-in-out infinite; }
.title h1 { margin: 0; font: 700 clamp(52px, 12vw, 104px)/.95 var(--title); color: #fff; letter-spacing: .01em;
  text-shadow: 0 3px 0 #e9d3a8, 0 6px 0 var(--wood), 0 9px 0 var(--wood2), 0 16px 26px rgba(50,30,15,.45); }
.title .sub { margin-top: 12px; font-weight: 800; font-size: 16px; color: #fff; text-shadow: 0 1px 3px rgba(50,30,15,.6), 0 0 14px rgba(50,30,15,.35); }
.mmenu { width: 100%; padding: 16px; display: flex; flex-direction: column; gap: 9px; }
.mmenu .btn { width: 100%; justify-content: flex-start; padding-left: 18px; font-size: 16px; }
.mmenu .btn .e { width: 28px; font-size: 20px; text-align: center; }
.mmenu .btn .d { margin-left: auto; font-size: 12.5px; font-weight: 700; opacity: .85; }
.mmenu .foot { text-align: center; font-size: 12px; color: var(--mute); margin-top: 2px; }

label.f { display: block; margin: 0 0 12px; } label.f > span { display: block; font-size: 13px; font-weight: 800; color: var(--ink2); margin-bottom: 4px; }
input[type=text], select { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fffdf8; font-weight: 700; outline: none; }
input[type=text]:focus, select:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(111,169,212,.25); }
input[type=range] { width: 100%; accent-color: var(--wood); height: 28px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.mode { cursor: pointer; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper2); text-align: center; transition: .15s; }

/* Inseln */

.book nav button:hover { background: rgba(255,255,255,.12); }

.book .pg { display: flex; flex-direction: column; min-height: 0; }
.book .body { flex: 1; overflow: auto; padding: 22px 26px; }
.book .body h3 { margin: 0 0 10px; font: 700 24px var(--title); color: var(--wood2); }

.book .body p { margin: 0 0 10px; }

.book .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 2px solid var(--paper3); }

.tile-e { display: grid; grid-template-columns: 92px 1fr 80px; gap: 14px; padding: 12px 0; border-bottom: 2px dashed var(--paper3); align-items: start; }
.tile-e:last-child { border-bottom: 0; }
.tile-e .im { width: 92px; height: 92px; border-radius: 14px; overflow: hidden; background: radial-gradient(#fff8e8, #ecdcbc); border: 2px solid var(--line); display: grid; place-items: center; font-size: 44px; position: relative; }
.tile-e .im img { width: 100%; height: 100%; object-fit: cover; }
.tile-e .im .lock { position: absolute; inset: 0; background: rgba(60,40,20,.45); display: grid; place-items: center; font-size: 26px; }
.tile-e b { font: 700 19px var(--title); } .tile-e p { margin: 2px 0 6px !important; font-size: 14px; color: var(--ink2); }
.tile-e .k { font-size: 12.5px; color: var(--ink2); margin-bottom: 2px; } .tile-e .k em { font-style: normal; font-weight: 800; color: var(--ink); }
.tile-e svg { width: 80px; height: 80px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-bottom: 4px; } .legend i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; margin-bottom: 10px; }
table.t th, table.t td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--paper3); }
table.t th { font-size: 12.5px; color: var(--ink2); }
table.t td:first-child, table.t th:first-child { text-align: left; }
table.t td.hi { font-weight: 800; color: var(--green2); } table.t td.lo { color: var(--paper3); }
.ctl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; font-size: 14px; margin-bottom: 10px; } .ctl > :nth-child(odd) { white-space: nowrap; }

/* Fotomodus */
.photobar { position: absolute; left: 12px; right: 12px; margin: 0 auto; max-width: 720px; bottom: calc(16px + var(--safe-b)); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: auto; animation: slidein .3s ease both; }
.photobar .filters { display: flex; gap: 6px; overflow-x: auto; }
.photobar .filters button { flex: none; border: 2px solid var(--line); background: var(--paper2); border-radius: 11px; padding: 6px 12px; font-weight: 800; font-size: 13px; cursor: pointer; min-height: 36px; }
.photobar .filters button.on { border-color: var(--gold); background: #fffaf0; box-shadow: 0 0 0 3px rgba(233,180,76,.3); }
.flash { position: fixed; inset: 0; background: #fff; z-index: 60; pointer-events: none; animation: flash .5s ease-out both; }
@keyframes flash { from { opacity: .85; } to { opacity: 0; } }
.recpill { position: absolute; top: calc(14px + var(--safe-t)); left: 50%; transform: translateX(-50%); padding: 7px 14px; font-weight: 800; z-index: 30; }
.recpill i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 8px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* Ende */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { padding: 10px 12px; border-radius: 14px; background: var(--paper2); border: 2px solid var(--line); }
.stat b { display: block; font: 700 26px/1.1 var(--title); color: var(--wood2); } .stat span { font-size: 12.5px; color: var(--ink2); font-weight: 800; }
.stat.big { grid-column: span 2; text-align: center; background: #fffaf0; border-color: var(--gold); } .stat.big b { font-size: 46px; }
.groups { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.groups span { padding: 4px 10px; border-radius: 10px; background: var(--paper2); border: 2px solid var(--line); font-weight: 800; font-size: 13.5px; }

/* Dialoge */
.dlg { width: min(400px, 100%); padding: 20px 22px; }
.dlg h2 { margin: 0 0 10px; font: 700 23px/1.15 var(--title); color: var(--wood2); } .dlg p { color: var(--ink2); }

/* ---------- Handy ---------- */
@media (max-width: 700px) {
  body { font-size: 14px; }
  .hud { padding: calc(8px + var(--safe-t)) 8px 0; gap: 6px; flex-wrap: wrap; }

  .cards { width: 100%; align-items: center; } .ucard { width: 100%; max-width: 380px; padding: 10px 12px; } .ucard .it .im { width: 48px; height: 48px; font-size: 26px; }
  .banner { width: calc(100% - 40px); display: flex; justify-content: center; } .ribbon { padding: 8px 14px 10px; } .ribbon b { font-size: 20px; white-space: normal; }
  .info { width: 100% !important; max-width: 380px; }
  .tut, .tut.at-stack { left: 8px; right: 8px; width: auto; transform: none; top: auto; bottom: calc(176px + var(--safe-b)); }
  .tut .pip { display: none; } .tut .bub { padding: 9px 12px 8px; } .tut .bub::before { display: none; } .tut p { font-size: 13.5px; margin-bottom: 4px; } .tut h4 { font-size: 16px; }
  .ucard .it p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .ucard .note { display: none; } .ucard h3 { font-size: 18px; margin-bottom: 6px; } .ucard .it { margin-bottom: 6px; }
  .modal { padding: 18px 16px; } .modal h2 { font-size: 24px; }
  .modes { grid-template-columns: 1fr; } .mode { display: grid; grid-template-columns: 36px 1fr; text-align: left; align-items: center; column-gap: 8px; } .mode .e { grid-row: span 2; }
  .set { grid-template-columns: 1fr 48px; } .set > span:first-child { grid-column: span 2; margin-bottom: -6px; } .seg { grid-column: span 2; }
  .slot { flex-wrap: wrap; } .slot .th { width: 92px; height: 60px; } .slot .acts { max-width: none; width: 100%; justify-content: flex-start; }
  .book { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: 100%; }
  .book nav { flex-direction: row; overflow-x: auto; padding: 10px; gap: 4px; box-shadow: inset 0 -6px 10px rgba(0,0,0,.15); }
  .book nav h2 { display: none; } .book nav button { flex: none; padding: 7px 10px; font-size: 13px; }
  .book .body { padding: 16px; } .book .x { top: 6px; right: 6px; } .book .x .btn { background: var(--paper); width: 40px; height: 40px; } .book nav { padding-right: 56px; }
  .tile-e { grid-template-columns: 72px 1fr; } .tile-e .im { width: 72px; height: 72px; } .tile-e svg { display: none; }
  .stats { grid-template-columns: 1fr 1fr; } .stat.big b { font-size: 38px; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } }
