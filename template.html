<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What if zombies attacked your farm?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800;900&display=swap">
<style>
  :root { --accent: #FFD23F; --ink: #111; --bad: #FF5A4E; --cap: "Anton", Impact, "Arial Narrow Bold", sans-serif; --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #07080B; display: grid; place-items: center; overflow: hidden; font-family: var(--ui); -webkit-font-smoothing: antialiased; color: #fff; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; container-type: size; background: #000; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #dim, #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #dim { background: #000; }
  #flash { background: #fff; }
  /* HUD: top 7 % (just under the app's top bar, covers as little video as possible), bottom 22 %, left 6 %, right 13 % */
  #hud { position: absolute; left: 6cqw; right: 13cqw; top: 7cqh; bottom: 22cqh; pointer-events: none; }
  .top { display: flex; align-items: center; gap: 1.8cqw; flex-wrap: wrap; }
  .badge, #phase { font: 900 2.4cqw/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; padding: 1.0cqw 1.7cqw .9cqw; border-radius: 1.1cqw; white-space: nowrap; }
  .badge { background: var(--accent); color: var(--ink); }
  #phase { background: rgba(8, 10, 14, .66); font-weight: 800; font-variant-numeric: tabular-nums; }
  #phase:empty { display: none; }
  #stats { margin-top: 1.3cqw; display: flex; flex-direction: column; gap: .7cqw; align-items: flex-start; }
  .stat { display: flex; align-items: baseline; gap: 1.5cqw; background: rgba(8, 10, 14, .62); padding: .75cqw 1.5cqw .65cqw 1.3cqw; border-radius: .9cqw; border-left: .5cqw solid var(--accent); transform-origin: 0 50%; opacity: 0; }
  .stat.bad { border-left-color: var(--bad); }
  .stat .l { font: 800 1.7cqw/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .82); white-space: nowrap; }
  .stat .v { font: 400 3.2cqw/1 var(--cap); letter-spacing: .01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .d { font: 900 2.0cqw/1 var(--ui); font-variant-numeric: tabular-nums; white-space: nowrap; opacity: 0; }   /* change pop-up: +120 / −30% */
  /* caption + end card: 7cqw here + the HUD's 6cqw = 13cqw on both sides, so the text is centred on the full frame */
  #cap { position: absolute; left: 7cqw; right: 0; bottom: 0; text-align: center; }
  #cap.mid { bottom: auto; top: 43cqh; transform: translateY(-50%); }   /* 43 + the HUD's 7 = 50 % of the frame */
  #cap .k { display: inline-block; font: 900 2.6cqw/1 var(--ui); letter-spacing: .16em; text-transform: uppercase; background: var(--accent); color: var(--ink); padding: 1.2cqw 2cqw 1.1cqw; border-radius: 1.2cqw; margin-bottom: 2.2cqw; }
  .m, #end .q { font: 400 7.0cqw/1.06 var(--cap); text-transform: uppercase; letter-spacing: .005em; color: #fff;
    text-shadow: .45cqw 0 0 #000, -.45cqw 0 0 #000, 0 .45cqw 0 #000, 0 -.45cqw 0 #000, .32cqw .32cqw 0 #000, -.32cqw .32cqw 0 #000, .32cqw -.32cqw 0 #000, -.32cqw -.32cqw 0 #000, 0 1.2cqw 2.6cqw rgba(0, 0, 0, .6); }
  #cap.big .m { font-size: 8.8cqw; }
  .w { display: inline-block; white-space: pre; will-change: transform, opacity; }
  .hl { color: var(--accent); } .bd { color: var(--bad); }
  .w.on { background: var(--accent); color: var(--ink); text-shadow: none; border-radius: 1.4cqw; padding: 0 1.2cqw; margin: 0 -1.2cqw; box-shadow: 0 .8cqw 2cqw rgba(0, 0, 0, .45); }   /* karaoke: the word being said */
  .w.bd.on { background: var(--bad); color: #fff; }
  #end { position: absolute; left: 7cqw; right: 0; top: 43cqh; transform: translateY(-50%); text-align: center; opacity: 0; }
  #end .q { font-size: 7.6cqw; }
  #end .opts { margin-top: 4.2cqw; display: flex; flex-direction: column; gap: 2cqw; align-items: center; }
  #end .o { font: 800 3.9cqw/1 var(--ui); background: rgba(255, 255, 255, .96); color: #111; padding: 2cqw 3.4cqw; border-radius: 2.2cqw; width: 64%; text-align: left; display: flex; gap: 2.6cqw; align-items: center; box-shadow: 0 1.4cqw 3cqw rgba(0, 0, 0, .35); }
  #end .o b { flex: none; display: grid; place-items: center; width: 6cqw; height: 6cqw; border-radius: 50%; background: var(--accent); color: var(--ink); font-weight: 900; }
  /* series intro: last episode's end card with the chosen option (CFG.series.prev) */
  #prev { position: absolute; left: 7cqw; right: 0; top: 43cqh; transform: translateY(-50%); text-align: center; opacity: 0; }
  #prev .k { display: inline-block; font: 900 2.9cqw/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; background: var(--accent); color: var(--ink); padding: 1.3cqw 2.1cqw 1.2cqw; border-radius: 1.3cqw; }
  #prev .q { margin-top: 3cqw; font: 400 7.2cqw/1.05 var(--cap); text-transform: uppercase; color: #fff; text-shadow: 0 .5cqw 2cqw rgba(0, 0, 0, .6); }
  #prev .q em { font-style: normal; color: var(--accent); }
  #prev .opts { margin-top: 3.6cqw; display: flex; flex-direction: column; gap: 2cqw; align-items: center; }
  #prev .o { font: 800 3.9cqw/1 var(--ui); background: rgba(255, 255, 255, .96); color: #111; padding: 2cqw 3.4cqw; border-radius: 2.2cqw; width: 64%; text-align: left; display: flex; gap: 2.6cqw; align-items: center; box-shadow: 0 1.4cqw 3cqw rgba(0, 0, 0, .35); }
  #prev .o b { flex: none; display: grid; place-items: center; width: 6cqw; height: 6cqw; border-radius: 50%; background: var(--accent); color: var(--ink); font-weight: 900; }
  #prev .o i { margin-left: auto; font-style: normal; font-weight: 900; color: #1E9E45; opacity: 0; }
  #prev .o.pick { background: var(--accent); color: var(--ink); }
  #prev .o.pick b { background: var(--ink); color: var(--accent); }
  #prev .st { margin-top: 3.6cqw; font: 400 7.6cqw/1 var(--cap); text-transform: uppercase; color: var(--accent); text-shadow: 0 .5cqw 2cqw rgba(0, 0, 0, .7); opacity: 0; }
  /* ending card (END.ending): big ✓ / ☠, 'You survived' / 'You didn't make it', 'Ending 2 of 4' */
  #end .eic { font: 900 15cqw/1 var(--ui); margin-bottom: 2.4cqw; text-shadow: 0 .6cqw 2.4cqw rgba(0, 0, 0, .6); }
  #end .eic.ok { color: #6BE36B; } #end .eic.dead { color: #fff; }
  #end .en { margin-top: 3.4cqw; display: inline-block; font: 900 3.2cqw/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; background: var(--accent); color: var(--ink); padding: 1.4cqw 2.4cqw 1.3cqw; border-radius: 1.3cqw; }
  #end .follow { margin-top: 3cqw; font: 800 3.2cqw/1.25 var(--ui); color: #fff; text-shadow: 0 .3cqw 1cqw #000; }
  #end .follow b { color: var(--accent); }
  #chan { display: block; margin: 0 0 1.1cqw; font: 800 2.3cqw/1 var(--ui); letter-spacing: .03em; color: rgba(255, 255, 255, .9); text-shadow: 0 .3cqw 1cqw #000; white-space: nowrap; }   /* channel handle: top-left, first line of the HUD */
  #chan:empty { display: none; }
  #end .cta, #rev .cta { margin-top: 4.2cqw; font: 900 3.1cqw/1.25 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); text-shadow: 0 .3cqw 1cqw #000; }
  /* Dr. Steve & co: lower-third name card above the caption */
  #cap .who { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1cqw; background: #fff; color: #111; padding: 1.7cqw 2.8cqw 1.6cqw 2.4cqw; border-radius: 1.6cqw; border-left: 1.1cqw solid #3FA9F5; margin-bottom: 2.6cqw; text-align: left; box-shadow: 0 1cqw 2.6cqw rgba(0, 0, 0, .45); }
  #cap .who b { font: 900 3.8cqw/1 var(--ui); letter-spacing: .02em; text-transform: uppercase; }
  #cap .who span { font: 700 2.6cqw/1 var(--ui); color: #5A5A5A; }
  /* Dr. Steve verdict stamp (BEATS[].stamp: 'wrong' | 'right') */
  #stamp { position: absolute; left: 7cqw; right: 0; top: 24cqh; text-align: center; opacity: 0; pointer-events: none; }
  #stamp b { display: inline-block; font: 400 9cqw/1 var(--cap); text-transform: uppercase; letter-spacing: .02em; padding: 1.6cqw 3.4cqw 1.2cqw; border: 1.1cqw solid; border-radius: 2cqw; background: rgba(10, 10, 12, .55); transform: rotate(-8deg); text-shadow: 0 .4cqw 1.6cqw rgba(0, 0, 0, .6); }
  #stamp.wrong b { color: #FF3B4A; border-color: #FF3B4A; } #stamp.right b { color: #3EE07A; border-color: #3EE07A; }
  /* review card: the last card of every video */
  #rev { position: absolute; left: 7cqw; right: 0; top: 43cqh; transform: translateY(-50%); text-align: center; opacity: 0; }
  #rev .card { display: inline-block; width: 82%; text-align: left; background: #fff; color: #111; border-radius: 3cqw; padding: 4cqw 4.4cqw 3.4cqw; box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, .5); }
  #rev .hd { display: flex; align-items: center; gap: 2.4cqw; }
  #rev .hd > b { flex: none; display: grid; place-items: center; width: 8.4cqw; height: 8.4cqw; border-radius: 50%; background: var(--accent); color: var(--ink); font: 900 4cqw/1 var(--ui); }
  #rev .hd span { display: flex; flex-direction: column; gap: .8cqw; }
  #rev .hd i { font: 800 3.4cqw/1 var(--ui); font-style: normal; }
  #rev .hd em { font: 700 2.4cqw/1 var(--ui); font-style: normal; color: #2E9E5B; letter-spacing: .04em; text-transform: uppercase; }
  #rev .st { display: flex; gap: 1cqw; margin: 3cqw 0 2.2cqw; }
  #rev .st span { width: 7.4cqw; height: 7.4cqw; color: #D8D8D8; }
  #rev .st span.on { color: #FFB400; }
  #rev .st svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  #rev .ti { font: 400 6.2cqw/1.05 var(--cap); text-transform: uppercase; }
  #rev .tx { margin-top: 1.8cqw; font: 600 4cqw/1.3 var(--ui); color: #333; }
  #rev .ft { margin-top: 2.8cqw; padding-top: 2.2cqw; border-top: .3cqw solid #EEE; font: 700 2.6cqw/1 var(--ui); color: #8A8A8A; }
  /* preview controls (never in the exported video) */
  #ui { position: absolute; left: 0; right: 0; bottom: 0; height: 12cqh; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
  #pill { align-self: center; margin-bottom: 3cqw; display: inline-flex; gap: 1.6cqw; align-items: center; font: 800 3cqw/1 var(--ui); letter-spacing: .06em; background: rgba(255, 255, 255, .94); color: #111; padding: 2cqw 3.2cqw; border-radius: 99cqw; box-shadow: 0 1cqw 3cqw rgba(0, 0, 0, .4); transition: opacity .3s; }
  #pill svg { width: 4cqw; height: 4cqw; }
  #bar { height: .8cqw; background: rgba(255, 255, 255, .18); }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  #stage.sound #pill { opacity: 0; }
  #stage.paused #pill { opacity: 1; }
  body.export #ui { display: none; }
  .err { position: absolute; inset: auto 6cqw 30cqh; padding: 3cqw 4cqw; border-radius: 3cqw; background: #fff; color: #111; font: 600 3cqw/1.4 var(--ui); }
  #thumb { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 60; }
  .thumbmode #thumb { display: block; } .thumbmode #hud { display: none; }
  #thumb .tt { position: absolute; left: 5%; right: 5%; top: 8%; text-align: center; font: 400 15cqw/0.96 var(--cap); text-transform: uppercase; color: #fff; transform: rotate(-3deg); -webkit-text-stroke: 1.1cqw #000; paint-order: stroke fill; text-shadow: 0 1.2cqw 0 #000, 0 2.4cqw 5cqw rgba(0, 0, 0, .55); letter-spacing: .005em; }
  #thumb .tt .hl { color: var(--ink); background: var(--accent); -webkit-text-stroke: 0; text-shadow: none; padding: 0 2.2cqw; border-radius: 1.8cqw; display: inline-block; transform: rotate(2.5deg); box-shadow: 0 1.3cqw 0 #000, 0 2.6cqw 5cqw rgba(0, 0, 0, .5); margin: .8cqw 0; }
  #thumb .tt .bd { color: var(--bad); }
  #thumb .sub { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%) rotate(-2deg); font: 900 6cqw/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--ink); padding: 2cqw 4cqw; border-radius: 2cqw; box-shadow: 0 1.2cqw 0 #000; white-space: nowrap; }
  #thumb .hd { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); font: 700 3.4cqw/1 var(--ui); color: #fff; text-shadow: 0 .4cqw 1.2cqw #000; }
  #thumb .ring { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); border: 1.6cqw solid #FF2B2B; border-radius: 50%; box-shadow: 0 0 0 .7cqw #000, inset 0 0 0 .7cqw #000; }
  #thumb .tst { position: absolute; transform: translate(-50%, -50%) rotate(-12deg); }
  #thumb .tst b { display: block; font: 400 17cqw/1 var(--cap); text-transform: uppercase; color: var(--sc); padding: 1.6cqw 4.4cqw 1cqw; border: 1.6cqw solid var(--sc); border-radius: 2.6cqw; background: rgba(10, 10, 12, .62); box-shadow: 0 1.4cqw 0 #000, 0 2.6cqw 5cqw rgba(0, 0, 0, .55); letter-spacing: .01em; }
  #thumb .tme { position: absolute; transform: translate(-50%, -50%) rotate(4deg); width: 38cqw; padding: 2.4cqw 2.6cqw 2cqw; border-radius: 3cqw; background: rgba(8, 10, 14, .82); box-shadow: 0 1.2cqw 0 #000; text-align: center; }
  #thumb .tme svg { width: 100%; display: block; } #thumb .tme path[stroke] { fill: none; stroke-width: 10; } #thumb .tme g path, #thumb .tme g circle { fill: #fff; }
  #thumb .tme span { display: block; margin-top: .8cqw; font: 900 3.4cqw/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  #thumb .tbg { position: absolute; transform: translate(-50%, -50%) rotate(-2deg); font: 400 15cqw/1 var(--cap); color: var(--ink); background: var(--accent); padding: 1.4cqw 3.6cqw .8cqw; border-radius: 2.2cqw; box-shadow: 0 1.3cqw 0 #000, 0 2.6cqw 5cqw rgba(0, 0, 0, .5); white-space: nowrap; }
  #thumb .arr { position: absolute; width: 26cqw; filter: drop-shadow(0 1cqw 1.5cqw rgba(0, 0, 0, .5)); }
  .stat .ic { width: 2.5cqw; height: 2.5cqw; flex: none; align-self: center; color: var(--accent); }
  .stat.bad .ic, .stat.crit .ic { color: var(--bad); }
  .stat .ic svg, .stat .stars svg { width: 100%; height: 100%; display: block; fill: currentColor; }
  .stat .bar { position: relative; width: 15cqw; height: 1.4cqw; background: rgba(255, 255, 255, .16); border-radius: .8cqw; overflow: hidden; align-self: center; flex: none; }
  .stat .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; border-radius: .8cqw; background: #6BE36B; }
  .stat.t-vs .bar { background: var(--bad); }
  .stat .stars { display: flex; gap: .35cqw; align-self: center; }
  .stat .stars svg { width: 2.5cqw; height: 2.5cqw; fill: rgba(255, 255, 255, .22); transition: none; }
  .stat .stars svg.on { fill: #FFC93C; }
  .stat .why { font: 800 1.6cqw/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--bad); padding: .55cqw 1cqw; border-radius: .6cqw; white-space: nowrap; opacity: 0; align-self: center; }
  .stat .why.good { background: #2E9E5B; }
  .stat.crit { border-left-color: var(--bad); background: rgba(110, 12, 12, .74); }
  .stat.big { padding: 1cqw 1.9cqw .9cqw 1.6cqw; }
  .stat.big .v { font-size: 4.6cqw; } .stat.big .l { font-size: 2cqw; } .stat.big .ic { width: 3.4cqw; height: 3.4cqw; } .stat.big .bar { width: 21cqw; height: 2cqw; }
  #rev .rc { margin-top: 2.4cqw; display: grid; grid-template-columns: 1fr auto; gap: 1cqw 2.4cqw; font: 700 2.8cqw/1.15 var(--ui); color: #555; }
  #rev .rc b { font: 400 3.6cqw/1 var(--cap); color: #111; text-align: right; }

  /* explainer layer (v2.6): callouts pinned to 3D points, freeze frame, gauge, cards, step chip, graph stat */
  #xl { position: absolute; inset: 0; pointer-events: none; }
  #xlsvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #xl .lk, #xl .ak { fill: none; stroke: rgba(0, 0, 0, .7); stroke-width: 1.15; stroke-linecap: round; }
  #xl .ln { fill: none; stroke-width: .55; stroke-linecap: round; }
  #xl .ak { stroke-width: 2.3; } #xl .an { fill: none; stroke-width: 1.3; stroke-linecap: round; }
  #xl .hk { fill: rgba(0, 0, 0, .7); stroke: rgba(0, 0, 0, .7); stroke-width: 1.1; stroke-linejoin: round; }
  #xl .dk { fill: rgba(0, 0, 0, .65); } #xl .dt { stroke: #fff; stroke-width: .32; } #xl .dp { fill: none; stroke-width: .35; }
  #xl .rk { fill: none; stroke: rgba(0, 0, 0, .65); stroke-width: 1.6; stroke-dasharray: 100; } #xl .rg { fill: none; stroke-width: .8; stroke-dasharray: 100; stroke-linecap: round; }
  .xc { position: absolute; left: 0; top: 0; opacity: 0; display: flex; flex-direction: column; align-items: flex-start; gap: .7cqw; background: rgba(8, 10, 14, .86); border-left: .7cqw solid var(--c); border-radius: 1.1cqw; padding: 1.25cqw 1.9cqw 1.1cqw 1.6cqw; box-shadow: 0 .8cqw 2.4cqw rgba(0, 0, 0, .45); white-space: nowrap; }
  .xc b { font: 800 2.9cqw/1.05 var(--ui); letter-spacing: .02em; text-transform: uppercase; color: #fff; }
  .xc span { font: 700 2.1cqw/1.1 var(--ui); color: rgba(255, 255, 255, .72); }
  .xc.k-arrow b { font-size: 3.3cqw; }
  .xc.k-tag { border-left: 0; background: var(--c); padding: 1.2cqw 2cqw 1.05cqw; } .xc.k-tag b { color: var(--ink); } .xc.k-tag span { color: var(--ink); opacity: .7; }
  .xc.k-tag::after { content: ''; position: absolute; left: 50%; bottom: -1.5cqw; transform: translateX(-50%); border: 1.6cqw solid transparent; border-top-color: var(--c); border-bottom: 0; }
  #frz { position: absolute; inset: 2.4cqw; border: .6cqw solid rgba(255, 255, 255, .92); border-radius: 2.6cqw; box-shadow: inset 0 0 6cqw rgba(140, 200, 255, .25), 0 0 2cqw rgba(0, 0, 0, .35); pointer-events: none; opacity: 0; }
  #frz .fl { position: absolute; left: 0; right: 0; top: calc(36cqh - 2.4cqw); text-align: center; }
  #frz .fl b { display: inline-flex; align-items: center; gap: 1.3cqw; font: 900 3.1cqw/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; background: #fff; color: #111; padding: 1.5cqw 2.4cqw 1.35cqw; border-radius: 1.3cqw; box-shadow: 0 1cqw 3cqw rgba(0, 0, 0, .5); }
  #frz .fl b svg { width: 2.7cqw; height: 2.7cqw; fill: var(--bad); flex: none; }
  #frz .fl span { display: block; margin-top: 1.4cqw; font: 800 2.4cqw/1.2 var(--ui); color: #fff; text-shadow: 0 .3cqw 1cqw #000; }
  #gauge { position: absolute; left: 6cqw; top: 33cqh; height: 32cqh; width: 40cqw; opacity: 0; pointer-events: none; }
  #gauge .gt { position: absolute; left: 0; top: -6cqw; font: 900 2cqw/1 var(--ui); letter-spacing: .14em; text-transform: uppercase; color: #fff; background: rgba(8, 10, 14, .7); padding: .95cqw 1.4cqw .85cqw; border-radius: .9cqw; white-space: nowrap; }
  #gauge .gb { position: absolute; left: 0; top: 0; bottom: 0; width: 1.6cqw; background: rgba(255, 255, 255, .2); border-radius: 1cqw; box-shadow: 0 0 0 .35cqw rgba(0, 0, 0, .35); }
  #gauge .gf { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--accent); border-radius: 1cqw; }
